<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Angular Signals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d18"/>
      <stop offset="1" stop-color="#12121e"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="250" cy="120" r="360" fill="url(#orbA)"/>
  <circle cx="1000" cy="520" r="340" fill="url(#orbB)"/>

  <!-- connections: signal (source) -> computed -> effect -->
  <g stroke="url(#line)" stroke-width="2.5" fill="none" opacity="0.55">
    <path d="M360 300 C 480 300, 520 190, 640 190"/>
    <path d="M360 300 C 480 300, 520 410, 640 410"/>
    <path d="M760 190 C 860 190, 870 300, 940 300"/>
    <path d="M760 410 C 860 410, 870 300, 940 300"/>
  </g>

  <!-- source node: signal() -->
  <g filter="url(#glow)">
    <circle cx="360" cy="300" r="30" fill="#a5b4fc"/>
    <circle cx="360" cy="300" r="30" fill="none" stroke="#ddd6fe" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="30;46;30" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- derived nodes: computed() -->
  <circle cx="700" cy="190" r="22" fill="#c4b5fd"/>
  <circle cx="700" cy="410" r="22" fill="#c4b5fd"/>

  <!-- effect node -->
  <circle cx="970" cy="300" r="26" fill="#a7f3d0"/>

  <!-- labels -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" fill="#ecebf4">
    <text x="360" y="372" text-anchor="middle" opacity="0.92">signal()</text>
    <text x="700" y="150" text-anchor="middle" opacity="0.8" fill="#c4b5fd">computed()</text>
    <text x="700" y="462" text-anchor="middle" opacity="0.8" fill="#c4b5fd">computed()</text>
    <text x="970" y="362" text-anchor="middle" opacity="0.85" fill="#a7f3d0">effect()</text>
  </g>

  <g font-family="'Instrument Serif', Georgia, serif">
    <text x="90" y="510" font-size="64" fill="#ecebf4" font-style="italic">Angular Signals</text>
  </g>
  <text x="92" y="552" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#7e7e9a" letter-spacing="2">REATIVIDADE SEM MÁGICA</text>
</svg>
